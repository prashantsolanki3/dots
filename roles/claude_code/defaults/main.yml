---
claude_code_enabled: true

# Provider: anthropic, bedrock, vertex
claude_provider: anthropic

# Path to the dotfiles repo (used for symlinks)
dotfiles_dir: "{{ playbook_dir }}"

# Config install mode: "link" for local dev (symlinks), "copy" for Docker (files copied)
claude_config_mode: link

# ── ai-toolkit: source of truth for Claude Code assets ─────────────────────
# Generic agents/commands/skills/hooks/mcp are installed by invoking
# @prashantsolanki3/ai-toolkit (the `dots-baseline` preset) rather than from
# copies shipped in this role. ai-toolkit is idempotent via its own lockfile,
# so re-running the role is a no-op when already in sync. In `link` config
# mode the install passes `--link` (symlinks back to the source); in `copy`
# mode it passes `--force` (real files). Toggle the whole flow off with
# claude_assets_via_ai_toolkit=false (e.g. to pin to a manually managed set).
claude_assets_via_ai_toolkit: true

# Version/tag of @prashantsolanki3/ai-toolkit to install. Pinned for
# reproducible lockfiles. Pre-publish, the same ref works from the Git tag:
#   npx --yes github:prashantsolanki3/ai-toolkit#v<version> install ...
ai_toolkit_version: "1.0.0"

# Target home directory.
#
# link mode (local dev): always uses the current user's $HOME — works on
# macOS (/Users/<user>), Linux, and WSL2 identically.
#
# copy mode (Docker / remote): uses /home/<host_username> when host_username
# is set, so a container image built under user 'builder' gets
# /home/builder/.claude regardless of the controller's HOME.
#
# The previous `if host_username is defined` pattern inadvertently matched on
# macOS too — roles/shell/defaults/main.yml defines host_username globally
# as ansible_user_id, so on a macOS host shell+claude_code would try to
# write to /home/<user>, which SIP refuses. Gating on claude_config_mode
# keeps Docker behaviour intact and makes link mode correct everywhere.
claude_home: "{{ '/home/' + host_username if claude_config_mode | default('link') == 'copy' and host_username is defined else ansible_facts['env']['HOME'] }}"

# ── Marketplace plugins (installed via `claude plugin install <name>`) ──────
claude_plugins:
  - ralph-loop
  - code-review
  - pr-review-toolkit
  - session-report
  - security-guidance
  - claude-md-management
  - hookify
  - code-simplifier

# External plugins from official marketplace
claude_external_plugins:
  - github
  - terraform
  - playwright
  - telegram

# Third-party marketplaces
claude_custom_marketplaces:
  - JuliusBrussee/caveman
  - moazbuilds/claudeclaw

# Plugins from custom marketplaces (format: <name>@<marketplace>)
claude_custom_plugins:
  - caveman@caveman
  - claudeclaw@claudeclaw

# ── npm packages (installed globally via `npm install -g`) ─────────────────
# For npx-based skills/tools and MCP servers
claude_npm_packages:
  - impeccable
  - sonarqube-mcp-server
  # qmd: local markdown search (BM25 + vector + rerank) with bundled MCP
  # server. Backs the llm_wiki role's /wiki-ingest, /wiki-query, /wiki-lint
  # slash commands. Its MCP server entry is shipped by ai-toolkit (the `mcp`
  # portion of the dots-baseline preset), not by this role.
  # NOTE: The "qmd" name on npmjs is an abandoned 2016 stub — the real
  # package is "@tobilu/qmd" (https://github.com/tobilu/qmd).
  - "@tobilu/qmd"
  # Uncomment to render wiki pages as slide decks:
  # - "@marp-team/marp-cli"

# ── uv tools (installed via `uv tool install`) ─────────────────────────────
# Python CLIs that back Claude Code skills. uv itself is installed by
# roles/dev_tools (install_uv).
#
# graphifyy: the `graphify` CLI — turns a repo into a queryable knowledge
# graph (https://github.com/Graphify-Labs/graphify). The `[terraform]` extra
# pulls tree-sitter-hcl; without it .tf/.hcl files contribute nothing. There
# is no YAML parser at any extra level, so YAML-heavy repos only reach the
# graph via semantic extraction, which needs ANTHROPIC_API_KEY (or another
# backend key) — a Claude Code subscription alone is not enough.
claude_uv_tools:
  - "graphifyy[terraform]"

# ── MCP servers / skills / commands ─────────────────────────────────────────
# These assets are now installed by ai-toolkit (the dots-baseline preset) via
# the claude_assets_via_ai_toolkit flow above — this role no longer ships or
# deploys files/mcp, files/skills, or files/commands. The three vars below are
# retained (default true) for backward compatibility with playbooks/overrides
# that still reference them; they no longer gate any task in this role. To add
# or change an asset, edit it in ai-toolkit, not here.
deploy_mcp_servers: true
deploy_skills: true
deploy_commands: true

# ── ClaudeClaw auto-start (launchd on macOS, systemd user on Linux) ─────────
# When enabled, dots deploys a user-level service that runs
# `claudeclaw-start --foreground` against the specified project directory
# at login / boot. The service restarts on failure (not on clean exit) and
# logs to <project>/.claude/claudeclaw/logs/{launchd,systemd}.{log,err}.
#
# Set claudeclaw_autostart_project_dir explicitly — the role fails loudly
# if autostart is enabled without it, since every user's project path is
# different and guessing would be wrong.
#
# Loading is opt-in (claudeclaw_autostart_load) so a provisioning run
# against a host with the daemon already running via the wrapper doesn't
# fight it for the web port. Flip to true once you're ready to hand off.
#
# Overrides:
#   -e claudeclaw_autostart_enabled=true
#   -e claudeclaw_autostart_project_dir=/Users/<you>/projects/<project>
#   -e claudeclaw_autostart_load=true
claudeclaw_autostart_enabled: false
claudeclaw_autostart_project_dir: ""
claudeclaw_autostart_load: false
