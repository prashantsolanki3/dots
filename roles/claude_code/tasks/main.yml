---
# roles/claude_code - Install and configure Claude Code CLI
#
# Handles macOS (Homebrew) and Linux (npm) installations.
# Config mode: "link" (default, symlinks for local dev) or "copy" (for Docker).
#
# Generic Claude Code assets (agents / commands / skills / hooks / mcp) are NOT
# shipped by this role anymore. They live in ai-toolkit
# (@prashantsolanki3/ai-toolkit), which this role invokes via npx to install
# the `dots-baseline` preset into ~/.claude. dots only orchestrates; ai-toolkit
# owns the content. Machine-level, dots-specific config (settings.json,
# settings.local.json, CLAUDE.md, claudeclaw, install.sh, entrypoint.sh,
# ~/.local/bin scripts, plugin/npm install lists) stays here.
#
# NOTE: The "link" config mode uses controller-local paths (role_path) for
# symlink sources. This is intentional — both mac.yml and dev.yml run with
# connection: local, so controller paths == target paths. The "copy" mode
# should be used for remote or containerised targets.

# ── macOS: verify claude is reachable via Homebrew ───────────────────────────
- name: "[macOS] Check that claude CLI binary exists via Homebrew"
  ansible.builtin.stat:
    path: "{{ homebrew_prefix | default('/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local') }}/bin/claude"
  register: claude_bin_mac
  when: ansible_facts['os_family'] == "Darwin"

- name: "[macOS] Warn if claude binary not found (install via: brew install claude)"
  ansible.builtin.debug:
    msg: >
      claude binary not found at expected Homebrew path.
      Install with: brew install claude
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not claude_bin_mac.stat.exists

# ── Linux / WSL2: always install/upgrade Claude Code to latest via npm ─────
- name: "[Linux] Install/upgrade Claude Code to latest via npm"
  become: true
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: latest
  when: ansible_facts['os_family'] == "Debian"

# ── Config mode: symlink (local dev) ────────────────────────────────────────
- name: Symlink Claude Code settings.json
  ansible.builtin.file:
    src: "{{ role_path }}/files/settings.json"
    dest: "{{ claude_home }}/.claude/settings.json"
    state: link
    force: true
  when: claude_config_mode | default('link') == 'link'

- name: Symlink Claude Code CLAUDE.md
  ansible.builtin.file:
    src: "{{ role_path }}/files/CLAUDE.md"
    dest: "{{ claude_home }}/.claude/CLAUDE.md"
    state: link
    force: true
  when: claude_config_mode | default('link') == 'link'

# ── Config mode: copy (Docker) ──────────────────────────────────────────────
- name: Copy Claude Code settings.json
  ansible.builtin.copy:
    src: settings.json
    dest: "{{ claude_home }}/.claude/settings.json"
    mode: '0644'
  when: claude_config_mode | default('link') == 'copy'

- name: Copy Claude Code CLAUDE.md
  ansible.builtin.copy:
    src: CLAUDE.md
    dest: "{{ claude_home }}/.claude/CLAUDE.md"
    mode: '0644'
  when: claude_config_mode | default('link') == 'copy'

# ── Claude Code assets via ai-toolkit (agents/commands/skills/hooks/mcp) ─────
# ai-toolkit (@prashantsolanki3/ai-toolkit) is the single source of truth for
# the generic Claude Code asset bundle. dots no longer ships its own copies of
# agents/commands/skills/hooks/mcp — it invokes the published CLI to install
# the `dots-baseline` preset into ~/.claude. ai-toolkit owns idempotency via
# its own lockfile (~/.claude/.ai-toolkit-lock.json for global scope), so a
# re-run over an unchanged tree is a no-op.
#
# `--link` is passed in `link` config mode (local dev) so edits to the source
# propagate; `copy` mode (Docker) gets real files. Hooks are both copied AND
# registered in settings.json by ai-toolkit, keyed off each hook's `event:`
# frontmatter — so the old standalone hook-copy block is gone too.
#
# Pre-publish note: until @prashantsolanki3/ai-toolkit is on npm, the same
# install works from the Git tag:
#   npx --yes github:prashantsolanki3/ai-toolkit#v{{ ai_toolkit_version }} install ...
- name: Install Claude Code assets via ai-toolkit (dots-baseline preset)
  ansible.builtin.command:
    argv:
      - npx
      - "--yes"
      - "@prashantsolanki3/ai-toolkit@{{ ai_toolkit_version }}"
      - install
      - "--tool"
      - claude-code
      - "--scope"
      - global
      - "--preset"
      - dots-baseline
      - "--target"
      - "{{ claude_home }}"
      - "{{ '--link' if claude_config_mode | default('link') == 'link' else '--force' }}"
  register: ai_toolkit_install
  # ai-toolkit is idempotent via its lockfile; treat a re-applied/no-op run as
  # unchanged. It prints install/update lines only when it actually writes.
  changed_when: >-
    ai_toolkit_install.rc == 0 and
    ('installed' in ai_toolkit_install.stdout or
     'updated' in ai_toolkit_install.stdout or
     'wrote' in ai_toolkit_install.stdout)
  when: claude_assets_via_ai_toolkit | default(true) | bool
  environment:
    HOME: "{{ claude_home }}"

# ── Settings.local.json (pre-approved permissions) ──────────────────────────
- name: Deploy settings.local.json (link)
  ansible.builtin.file:
    src: "{{ role_path }}/files/settings.local.json"
    dest: "{{ claude_home }}/.claude/settings.local.json"
    state: link
    force: true
  when: claude_config_mode | default('link') == 'link'

- name: Deploy settings.local.json (copy)
  ansible.builtin.copy:
    src: settings.local.json
    dest: "{{ claude_home }}/.claude/settings.local.json"
    mode: '0644'
  when: claude_config_mode | default('link') == 'copy'

# ── Hooks ────────────────────────────────────────────────────────────────────
# Hook scripts (e.g. preserve-effort-max.sh, branch-from-main.sh) and their
# settings.json registration are now owned by ai-toolkit and installed by the
# "Install Claude Code assets via ai-toolkit" task above — ai-toolkit both
# copies the script to ~/.claude/hooks/<name>.sh AND wires it into the
# settings.json `hooks` block keyed off each hook's `event:` frontmatter,
# which the old standalone copy could not do.

# ── User-level CLI scripts (installed into ~/.local/bin/, on $PATH) ─────────
# Wrapper scripts the user invokes from a shell or another tool. Currently:
#
#   claudeclaw-start.sh  →  workaround for the upstream claudeclaw bug where
#                            the daemon inherits and re-emits the parent
#                            CLAUDE_CODE_OAUTH_TOKEN, causing every spawned
#                            `claude` to 401 once the parent token rotates
#                            (~8h after Claude Desktop restart).
#
# Symlinks/copies into ~/.local/bin/<name without .sh>. Skip Windows since the
# whole role only supports macOS + Linux/WSL2.
- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ claude_home }}/.local/bin"
    state: directory
    mode: '0755'

- name: List bin scripts in role (controller-side)
  ansible.builtin.set_fact:
    bin_scripts: "{{ query('fileglob', role_path ~ '/files/scripts/*.sh') }}"

- name: Symlink each bin script into ~/.local/bin/ (without .sh suffix)
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ claude_home }}/.local/bin/{{ item | basename | regex_replace('\\.sh$', '') }}"
    state: link
    force: true
  loop: "{{ bin_scripts }}"
  when: claude_config_mode | default('link') == 'link'

- name: Copy each bin script into ~/.local/bin/ (without .sh suffix)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ claude_home }}/.local/bin/{{ item | basename | regex_replace('\\.sh$', '') }}"
    mode: '0755'
  loop: "{{ bin_scripts }}"
  when: claude_config_mode | default('link') == 'copy'

# ── ClaudeClaw user-level config (template + env example) ───────────────────
# Dots ships two files into ~/.config/claudeclaw/:
#
#   settings.template.json  Rendered from claudeclaw-settings.json.j2 using
#                           the Ansible vars listed at the top of the
#                           template. `claudeclaw-start` copies this file
#                           into <project>/.claude/claudeclaw/settings.json
#                           the first time the daemon is launched in that
#                           project (never overwrites existing settings).
#
#   env.example             Documented list of secret env vars the daemon
#                           consumes via $VAR substitution in settings.
#                           User copies this to ~/.config/claudeclaw/env
#                           and fills in values. We never ship or rewrite
#                           the real `env` file — it's gitignored user data.
#
# Directory mode 0700: contains secrets once the user populates env.
- name: Ensure ~/.config/claudeclaw directory exists
  ansible.builtin.file:
    path: "{{ claude_home }}/.config/claudeclaw"
    state: directory
    mode: '0700'
  tags: ['claudeclaw']

- name: Render ClaudeClaw settings template to ~/.config/claudeclaw/
  ansible.builtin.template:
    src: claudeclaw-settings.json.j2
    dest: "{{ claude_home }}/.config/claudeclaw/settings.template.json"
    mode: '0644'
  tags: ['claudeclaw']

- name: Deploy ClaudeClaw env.example (never overwrite user's env)
  ansible.builtin.copy:
    src: claudeclaw/env.example
    dest: "{{ claude_home }}/.config/claudeclaw/env.example"
    mode: '0600'
  tags: ['claudeclaw']

# ── ClaudeClaw auto-start (launchd / systemd user) ─────────────────────────
# Gate on claudeclaw_autostart_enabled — default off. When on, require the
# project directory so the rendered service knows where to cd.
- name: Validate claudeclaw_autostart_project_dir when autostart is enabled
  ansible.builtin.assert:
    that:
      - claudeclaw_autostart_project_dir | length > 0
    fail_msg: >
      claudeclaw_autostart_enabled=true but claudeclaw_autostart_project_dir
      is empty. Set an absolute path like
      `-e claudeclaw_autostart_project_dir=/Users/you/projects/thing`.
  when: claudeclaw_autostart_enabled | bool
  tags: ['claudeclaw', 'autostart']

# --- macOS: launchd user-agent ---
- name: Ensure ~/Library/LaunchAgents exists (macOS)
  ansible.builtin.file:
    path: "{{ claude_home }}/Library/LaunchAgents"
    state: directory
    mode: '0755'
  when:
    - claudeclaw_autostart_enabled | bool
    - ansible_facts['os_family'] == "Darwin"
  tags: ['claudeclaw', 'autostart']

- name: Render launchd plist for ClaudeClaw (macOS)
  ansible.builtin.template:
    src: claudeclaw.plist.j2
    dest: "{{ claude_home }}/Library/LaunchAgents/sh.claudeclaw.daemon.plist"
    mode: '0644'
  register: _claudeclaw_plist
  when:
    - claudeclaw_autostart_enabled | bool
    - ansible_facts['os_family'] == "Darwin"
  tags: ['claudeclaw', 'autostart']

- name: Reload launchd agent when plist changes (macOS)
  # bootout is idempotent-enough: succeeds if loaded, 'not loaded' if not.
  # bootstrap then loads with the current plist contents. failed_when: false
  # absorbs the expected 'not currently loaded' exit code on first run.
  ansible.builtin.shell: |
    set -e
    uid=$(id -u)
    launchctl bootout "gui/$uid/sh.claudeclaw.daemon" 2>/dev/null || true
    launchctl bootstrap "gui/$uid" "{{ claude_home }}/Library/LaunchAgents/sh.claudeclaw.daemon.plist"
  changed_when: true
  when:
    - claudeclaw_autostart_enabled | bool
    - claudeclaw_autostart_load | bool
    - ansible_facts['os_family'] == "Darwin"
    - _claudeclaw_plist is changed
  tags: ['claudeclaw', 'autostart']

# --- Linux: systemd --user service ---
- name: Ensure ~/.config/systemd/user exists (Linux)
  ansible.builtin.file:
    path: "{{ claude_home }}/.config/systemd/user"
    state: directory
    mode: '0755'
  when:
    - claudeclaw_autostart_enabled | bool
    - ansible_facts['os_family'] != "Darwin"
  tags: ['claudeclaw', 'autostart']

- name: Render systemd user service for ClaudeClaw (Linux)
  ansible.builtin.template:
    src: claudeclaw.service.j2
    dest: "{{ claude_home }}/.config/systemd/user/claudeclaw.service"
    mode: '0644'
  register: _claudeclaw_service
  when:
    - claudeclaw_autostart_enabled | bool
    - ansible_facts['os_family'] != "Darwin"
  tags: ['claudeclaw', 'autostart']

- name: Enable + (re)start ClaudeClaw systemd user service (Linux)
  ansible.builtin.systemd_service:
    name: claudeclaw.service
    scope: user
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if _claudeclaw_service is changed else 'started' }}"
  when:
    - claudeclaw_autostart_enabled | bool
    - claudeclaw_autostart_load | bool
    - ansible_facts['os_family'] != "Darwin"
  tags: ['claudeclaw', 'autostart']

- name: Autostart summary (tells user the manual load command if load=false)
  ansible.builtin.debug:
    msg: |
      ClaudeClaw autostart file deployed but NOT loaded (claudeclaw_autostart_load=false).
      To load manually:
      {% if ansible_facts['os_family'] == 'Darwin' %}
        launchctl bootstrap gui/$(id -u) {{ claude_home }}/Library/LaunchAgents/sh.claudeclaw.daemon.plist
      {% else %}
        systemctl --user daemon-reload
        systemctl --user enable --now claudeclaw.service
      {% endif %}
  when:
    - claudeclaw_autostart_enabled | bool
    - not claudeclaw_autostart_load | bool
  tags: ['claudeclaw', 'autostart']

# ── Plugin directory (marketplaces created by `claude plugin install`) ───────
- name: Ensure ~/.claude/plugins directory exists
  ansible.builtin.file:
    path: "{{ claude_home }}/.claude/plugins"
    state: directory
    mode: '0755'

# ── MCP servers ──────────────────────────────────────────────────────────────
# MCP server definitions (qmd, sonarqube, …) are now owned by ai-toolkit and
# merged into the global Claude config by the "Install Claude Code assets via
# ai-toolkit" task above (the `mcp` portion of the dots-baseline preset). dots
# no longer ships files/mcp/*.json or hand-merges them into ~/.claude.json.

# ── Install script ──────────────────────────────────────────────────────────
- name: Copy Claude Code install script
  ansible.builtin.copy:
    src: install.sh
    dest: "{{ claude_home }}/.claude/install.sh"
    mode: '0755'

# ── npm packages (for npx-based skills/tools) ───────────────────────────────
# `become: true` only on Linux — on macOS, global npm typically runs under
# nvm or a user-prefix, so sudo would break the install (wrong PATH) or
# prompt unnecessarily. Pattern matches roles/llm_wiki/tasks/install_qmd.yml.
- name: Install npm packages for Claude Code skills
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ claude_npm_packages | default([]) }}"
  when: claude_npm_packages is defined and claude_npm_packages | length > 0

# ── Official marketplace plugins ─────────────────────────────────────────────
- name: Install official marketplace plugins
  ansible.builtin.command: "claude plugin install {{ item }}"
  register: plugin_install
  changed_when: false
  failed_when: false
  loop: "{{ claude_plugins | default([]) }}"
  when: claude_plugins | default([]) | length > 0
  environment:
    HOME: "{{ claude_home }}"

- name: Install external plugins from official marketplace
  ansible.builtin.command: "claude plugin install {{ item }}"
  register: ext_plugin_install
  changed_when: false
  failed_when: false
  loop: "{{ claude_external_plugins | default([]) }}"
  when: claude_external_plugins | default([]) | length > 0
  environment:
    HOME: "{{ claude_home }}"

# ── Custom marketplace plugins (e.g., caveman) ──────────────────────────────
- name: Add custom plugin marketplaces
  ansible.builtin.command: "claude plugin marketplace add {{ item }}"
  register: marketplace_add
  changed_when: false
  failed_when: false
  loop: "{{ claude_custom_marketplaces | default([]) }}"
  when: claude_custom_marketplaces | default([]) | length > 0
  environment:
    HOME: "{{ claude_home }}"

- name: Install plugins from custom marketplaces
  ansible.builtin.command: "claude plugin install {{ item }}"
  register: custom_plugin_install
  changed_when: false
  failed_when: false
  loop: "{{ claude_custom_plugins | default([]) }}"
  when: claude_custom_plugins | default([]) | length > 0
  environment:
    HOME: "{{ claude_home }}"

# ── Docker-mode: deploy container entrypoint ─────────────────────────────────
# The entrypoint invokes `ansible-playbook sync-claude.yml` on every container
# start, re-running the idempotent tasks above against the mounted ~/.claude
# volume so dots updates propagate without a rebuild.
- name: "[Docker] Deploy container entrypoint script"
  become: true
  ansible.builtin.copy:
    src: entrypoint.sh
    dest: /usr/local/bin/entrypoint.sh
    mode: '0755'
    owner: root
    group: root
  when: claude_config_mode | default('link') == 'copy'
